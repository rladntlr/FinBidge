services:
  mysql:
    image: mysql:8.0
    container_name: finbridge-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finbridge
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finbridge-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finbridge-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkQkSWJUTHW0NjB3ZEdWdQ'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finbridge-network

  sftp:
    image: atmoz/sftp:latest
    container_name: finbridge-sftp
    command: finbridge:finbridge123:1000:100:upload
    ports:
      - "2222:22"
    volumes:
      - sftp_data:/home/finbridge/upload
      # Fixed demo host keys keep localhost:2222 stable across container recreation.
      - ./docker/sftp/host_keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
      - ./docker/sftp/host_keys/ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub
      - ./docker/sftp/host_keys/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
      - ./docker/sftp/host_keys/ssh_host_rsa_key.pub:/etc/ssh/ssh_host_rsa_key.pub
      - ./docker/sftp/init.d:/etc/sftp.d:ro
    networks:
      - finbridge-network

volumes:
  mysql_data:
  kafka_data:
  sftp_data:

networks:
  finbridge-network:
    driver: bridge
